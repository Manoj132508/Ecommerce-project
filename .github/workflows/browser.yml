# Real-browser suite (Phase 7A), one engine per runner. The local investigation
# (MIGRATION_PLAN.md 6B–6D) found stalls only with several engines and workers
# on a 4-core machine at 80–91 % CPU; here every engine gets its own runner, and
# each runs at 1 and at 2 workers so the two can be compared. Timeouts and the
# retry policy are those of playwright.config.ts (one retry for Firefox only);
# nothing here raises them. Throwaway stack only (browser/stack.mjs): a fresh
# database on this job's postgres:17-alpine service, compiled Express and `next start`.
name: Browser

on:
  pull_request:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  MONGODB_URI: ""
  DATABASE_URL: ""
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build backend and Next.js once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: |
            ecommerce-backend/package-lock.json
            apps/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: ecommerce-backend
      - run: npm ci && npm run build
        working-directory: apps/web
        env: { BACKEND_ORIGIN: "http://127.0.0.1:3000", NEXT_PUBLIC_APP_NAME: "Ecommerce" }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: builds
          # .next is a hidden folder; its cache is not needed by `next start`.
          include-hidden-files: true
          retention-days: 1
          path: |
            ecommerce-backend/dist
            apps/web/.next
            !apps/web/.next/cache

  browser:
    name: ${{ matrix.engine }} (${{ matrix.workers }} worker${{ matrix.workers == 1 && '' || 's' }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Microsoft's official Playwright image for exactly the locked version (apps/web/package-lock.json: 1.64.0),
    # pinned by digest. It ships the browser builds that version expects (Chromium 1248, Firefox 1555,
    # WebKit 2370) and their Ubuntu 24.04 libraries, so nothing is downloaded or apt-installed per job (that
    # step hung at the 15-minute bound in 4 of 10 runs). uid 1001 is the image's unprivileged pwuser and the
    # runner's own uid, so the checkout stays writable. No Docker socket, no privileged mode, no extra capability.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --user 1001
    # The disposable database server for browser/stack.mjs, which creates, migrates and drops its own database
    # on it (E2E_POSTGRES_SERVER_URL) instead of starting a container itself. No published port: reachable only
    # from this job's network, and removed with the job. The password is a fixed placeholder for that reason.
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: e2e, POSTGRES_PASSWORD: e2e, POSTGRES_DB: e2e }
        options: >-
          --health-cmd "pg_isready -U e2e -d e2e" --health-interval 2s --health-timeout 5s --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
        workers: [1, 2]
        include:
          - { engine: chromium, projects: "--project=chromium-desktop --project=chromium-tablet --project=chromium-mobile" }
          - { engine: webkit, projects: "--project=webkit-desktop --project=webkit-mobile" }
          - { engine: firefox, projects: "--project=firefox-desktop" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: |
            ecommerce-backend/package-lock.json
            apps/web/package-lock.json
      - run: npm ci
        working-directory: ecommerce-backend
      - run: npm ci
        working-directory: apps/web
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: builds }
      # The image's browsers only fit the Playwright version they were built for: fail here, plainly, if the
      # lockfile moves on without the image tag (and digest) above.
      - name: Playwright version matches the image
        working-directory: apps/web
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          echo "Playwright $installed; browsers in $PLAYWRIGHT_BROWSERS_PATH: $(cd "$PLAYWRIGHT_BROWSERS_PATH" && echo *)"
          test "$installed" = "1.64.0" || { echo "::error::Playwright $installed does not match the v1.64.0 image"; exit 1; }
      - name: Runner capacity
        run: |
          echo "CPUs: $(nproc)"; free -m; df -h . | tail -1
      - name: Run the suite (${{ matrix.workers }} worker(s)) with load sampling
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/report.json
          E2E_POSTGRES_SERVER_URL: postgres://e2e:e2e@postgres:5432/e2e
        run: |
          mkdir -p test-results
          vmstat -n -t 5 > test-results/vmstat.log &
          sampler=$!
          status=0
          npx playwright test ${{ matrix.projects }} --workers=${{ matrix.workers }} --reporter=list,json,html || status=$?
          kill "$sampler" || true
          node scripts/browser-report-summary.mjs test-results/report.json test-results/vmstat.log
          exit "$status"
      # Small, always kept: counts, timings and load (no page content).
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: metrics-${{ matrix.engine }}-${{ matrix.workers }}w
          retention-days: 14
          path: |
            apps/web/test-results/report.json
            apps/web/test-results/vmstat.log
            apps/web/test-results/metrics
      # Traces, screenshots and the HTML report on failure. They contain only
      # throwaway accounts and data from this run's disposable database.
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: failure-${{ matrix.engine }}-${{ matrix.workers }}w
          retention-days: 7
          path: |
            apps/web/playwright-report
            apps/web/test-results/browser
